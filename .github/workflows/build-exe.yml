name: Build Windows EXE

on:
  push:
    branches: [main, build-installer-exe]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade pip pyinstaller pillow

      - name: Prepare application icon
        shell: pwsh
        run: |
          python -c "from PIL import Image,ImageDraw; im=Image.new('RGB',(512,512),'black'); d=ImageDraw.Draw(im); d.rectangle((70,70,469,469),outline='white',width=15); d.rectangle((129,159,221,238),fill='white'); d.rectangle((317,159,412,238),fill='white'); d.rectangle((223,239,317,279),fill='white'); d.rectangle((176,279,365,398),fill='white'); d.rectangle((225,358,318,399),fill='black'); im.save('logo.ico',format='ICO',sizes=[(256,256),(128,128),(64,64),(48,48),(32,32),(16,16)])"

      - name: Build standalone EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name ML-Installer --icon logo.ico --add-data "minekryak.dll;." --add-data "vcruntime140_1.dll;." app.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: ML-Installer-Windows
          path: dist/ML-Installer.exe
          if-no-files-found: error
          retention-days: 30
