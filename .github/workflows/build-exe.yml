name: Build Windows EXE

on:
  push:
    branches: [main, build-installer-exe]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade pip pyinstaller pillow

      - name: Prepare application icon
        run: python make_icon.py

      - name: Build standalone EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name ML-Installer --icon assets/logo.ico --add-data "minekryak.dll;." --add-data "vcruntime140_1.dll;." app.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: ML-Installer-Windows
          path: dist/ML-Installer.exe
          if-no-files-found: error
          retention-days: 30
